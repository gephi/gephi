EgoBuilder.name = इगो नेटवर्क
EgoBuilder.description = किसी विशेष नोड से गहराई 1, 2, 3 या अधिकतम तक के पड़ोसी रखें। नोड ID और LABEL पर regex से पाया जाता है।

GiantComponentBuilder.name = विशाल घटक
