DynamicSettingsPanel.infoLabel.description = मेट्रिक टाइमलाइन अंतराल के भीतर गणना की जाती है। समय विंडो ग्राफ़ स्नैपशॉट या सतत समय में नोड और एज के संघ का आकार निर्धारित करती है। विंडो टिक की लंबाई से आगे बढ़ती है, ताकि मेट्रिक उन क्षणों में गणना की जाए। यह टाइमलाइन अंतराल की शुरुआत से शुरू होती है और तब समाप्त होती है जब अगला टिक संभव नहीं होता। समय विंडो और टिक दोनों अवधि के रूप में परिभाषित हैं: स्नैपशॉट के लिए float/integer, या सतत समय के लिए तिथियाँ।
