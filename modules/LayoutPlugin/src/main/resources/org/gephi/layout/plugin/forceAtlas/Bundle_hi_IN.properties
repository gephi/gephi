name=Force Atlas
description=ForceAtlas ग्राफ़ को अधिक सघन, पठनीय बनाता है, और अधिकारियों को हब से अधिक केंद्रीय दिखा सकता है (Attraction Distrib. विकल्प)। ऑटो-स्टैबिलाइज़ेशन लेआउट के अंत में अभिसरण सुधारता है।

forceAtlas.inertia.name = जड़त्व
forceAtlas.inertia.desc = प्रत्येक नए पास पर नोड गति का संरक्षण
forceAtlas.repulsionStrength.name = प्रतिकर्षण शक्ति
forceAtlas.repulsionStrength.desc = प्रत्येक नोड दूसरों को कितनी ताकत से दूर करता है
forceAtlas.attractionStrength.name = आकर्षण शक्ति
forceAtlas.attractionStrength.desc = जुड़े नोडों के प्रत्येक जोड़े में कितनी ताकत से आकर्षण होता है
forceAtlas.maxDisplacement.name = अधिकतम विस्थापन
forceAtlas.maxDisplacement.desc = प्रत्येक नोड के विस्थापन को सीमित करता है (बहुत पास होने पर अति-प्रतिकर्षण रोकने के लिए)
forceAtlas.freezeBalance.name = स्वतः स्थिरीकरण फ़ंक्शन
forceAtlas.freezeBalance.desc = अस्थिर नोडों को स्थिर करने को सक्रिय करता है। कुछ दक्षता हानि के बावजूद, यह अधिकांश झिलमिलाहट रोकता है
forceAtlas.freezeStrength.name = ऑटोस्टैब शक्ति
forceAtlas.freezeStrength.desc = स्वतः स्थिरीकरण फ़ंक्शन की शक्ति
forceAtlas.freezeInertia.name = ऑटोस्टैब संवेदनशीलता
forceAtlas.freezeInertia.desc = [0,1] यह पैरामीटर एंटी-फ़्लिकर फ़ंक्शन की स्व-अनुकूलनशीलता दर्शाता है (वास्तव में, स्थिरीकरण जड़त्व)
forceAtlas.gravity.name = गुरुत्वाकर्षण
forceAtlas.gravity.desc = यह बल सभी नोडों को केंद्र की ओर आकर्षित करता है ताकि असंबद्ध घटक बिखर न जाएँ
forceAtlas.outboundAttractionDistribution.name = आकर्षण वितरण
forceAtlas.outboundAttractionDistribution.desc = आकर्षक बल बाहरी लिंक पर वितरित होता है। यह हब को किनारे की ओर और अधिकारियों को अधिक केंद्रीय बनाता है
forceAtlas.adjustSizes.name = आकार के अनुसार समायोजित करें
forceAtlas.adjustSizes.desc = नोड ओवरलैप से बचें (प्रत्येक नोड के आकार पर निर्भर)
forceAtlas.speed.name = गति
forceAtlas.speed.desc = मान > 0 डिफ़ॉल्ट 1; सटीकता की कीमत पर अभिसरण गति बढ़ाने देता है
