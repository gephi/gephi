ForceAtlas2.name=ForceAtlas 2
ForceAtlas2.description=गुणवत्ता लेआउट: कुछ अनुमानों (BarnesHut) के साथ रैखिक-आकर्षण रैखिक-प्रतिकर्षण मॉडल। गति स्वतः गणना होती है।

ForceAtlas2.tuning=समायोजन
ForceAtlas2.behavior=व्यवहार विकल्प
ForceAtlas2.performance=प्रदर्शन
ForceAtlas2.threads=थ्रेड

ForceAtlas2.scalingRatio.name=स्केलिंग
ForceAtlas2.scalingRatio.desc=आप कितना प्रतिकर्षण चाहते हैं। अधिक मान ग्राफ़ को अधिक विरल बनाता है।
ForceAtlas2.gravity.name=गुरुत्वाकर्षण
ForceAtlas2.gravity.desc=नोडों को केंद्र की ओर आकर्षित करता है। द्वीपों को दूर जाने से रोकता है।
ForceAtlas2.strongGravityMode.name=अधिक गुरुत्वाकर्षण
ForceAtlas2.strongGravityMode.desc=अधिक शक्तिशाली गुरुत्वाकर्षण नियम
ForceAtlas2.distributedAttraction.name=हब कम आकर्षित करें
ForceAtlas2.distributedAttraction.desc=आकर्षण को बाहरी एज पर वितरित करता है। हब कम आकर्षित होते हैं और किनारों की ओर धकेले जाते हैं।
ForceAtlas2.linLogMode.name=LinLog मोड
ForceAtlas2.linLogMode.desc=ForceAtlas के मॉडल को lin-lin से lin-log में बदलें (Andreas Noack को श्रद्धांजलि)। क्लस्टर को अधिक सघन बनाता है।
ForceAtlas2.normalizeEdgeWeights.name=एज वज़न सामान्यीकृत करें
ForceAtlas2.normalizeEdgeWeights.desc=एज वज़न को 0 और 1 के बीच रखता है।
ForceAtlas2.invertedEdgeWeightsMode.name=उल्टे एज वज़न
ForceAtlas2.invertedEdgeWeightsMode.desc=उल्टे 1/w एज वज़न उपयोग करें
ForceAtlas2.adjustSizes.name=ओवरलैप रोकें
ForceAtlas2.adjustSizes.desc=केवल spatialized स्थिति में उपयोग करें। "Approximate Repulsion" के साथ उपयोग नहीं करना चाहिए
ForceAtlas2.jitterTolerance.name=सहनशीलता (गति)
ForceAtlas2.jitterTolerance.desc=आप कितना झुलाव अनुमति देते हैं। 1 से ऊपर अनुशंसित नहीं। कम मान कम गति और अधिक सटीकता देते हैं।
ForceAtlas2.barnesHutOptimization.name=अनुमानित प्रतिकर्षण
ForceAtlas2.barnesHutOptimization.desc=Barnes Hut अनुकूलन: n² जटिलता से n.ln(n); बड़े ग्राफ़ की अनुमति देता है।
ForceAtlas2.barnesHutTheta.name=अनुमान
ForceAtlas2.barnesHutTheta.desc=Barnes Hut अनुकूलन का थीटा।
ForceAtlas2.edgeWeightInfluence.name=एज वज़न प्रभाव
ForceAtlas2.edgeWeightInfluence.desc=एज वज़न को आप कितना प्रभाव देते हैं। 0 = "कोई प्रभाव नहीं" और 1 = "सामान्य"।
ForceAtlas2.threads.name=थ्रेड की संख्या
ForceAtlas2.threads.desc=यदि आपके कोर संभाल सकें तो अधिक थ्रेड अधिक गति देते हैं।
