YifanHu.name=यिफान हू
YifanHu.description=यिफान हू का मूल attraction-repulsion मॉडल। बल गणना को पड़ोस तक सीमित करके गणना लागत घटाता है। एल्गोरिद्म स्वयं रुक जाता है क्योंकि इसमें अनुकूलनशील शीतलन योजना है।
YifanHuProportional.name=यिफान हू अनुपाती
YifanHuProportional.description=यिफान हू का संशोधित संस्करण जो अनुपाती विस्थापन योजना का उपयोग करता है।

YifanHu.optimalDistance.name=इष्टतम दूरी
YifanHu.optimalDistance.desc=स्प्रिंग की प्राकृतिक लंबाई। बड़े मान का अर्थ नोड अधिक दूर होंगे।
YifanHu.relativeStrength.name=सापेक्ष शक्ति
YifanHu.relativeStrength.desc=विद्युत बल (प्रतिकर्षण) और स्प्रिंग बल (आकर्षण) के बीच सापेक्ष शक्ति।
YifanHu.initialStepSize.name=प्रारंभिक चरण आकार
YifanHu.initialStepSize.desc=इंटीग्रेशन चरण में उपयोग किया गया प्रारंभिक चरण आकार। इस मान को इष्टतम दूरी की तुलना में अर्थपूर्ण आकार पर सेट करें (10% एक अच्छा प्रारंभ है)।
YifanHu.stepRatio.name=चरण अनुपात
YifanHu.stepRatio.desc=पुनरावृत्तियों में चरण आकार अपडेट करने का अनुपात।
YifanHu.adaptativeCooling.name=अनुकूलनशील शीतलन
YifanHu.adaptativeCooling.desc=अनुकूलनशील शीतलन के उपयोग को नियंत्रित करता है। यह लेआउट एल्गोरिद्म को ऊर्जा के स्थानीय न्यूनतम से बचने में मदद करता है।
YifanHu.convergenceThreshold.name=अभिसरण सीमा
YifanHu.convergenceThreshold.desc=सापेक्ष ऊर्जा अभिसरण सीमा। छोटे मान अधिक सटीकता दर्शाते हैं।
YifanHu.quadTreeMaxLevel.name=क्वाडट्री अधिकतम स्तर
YifanHu.quadTreeMaxLevel.desc=क्वाडट्री प्रतिनिधित्व में उपयोग किए जाने वाला अधिकतम स्तर। बड़े मान अधिक सटीकता देते हैं।
YifanHu.theta.name=थीटा
YifanHu.theta.desc=Barnes-Hut opening criteria के लिए थीटा पैरामीटर। छोटे मान अधिक सटीकता देते हैं।
