OpenOrd.name=OpenOrd
OpenOrd.description = वास्तविक दुनिया के बड़े-स्तरीय अदिशात्मक ग्राफ़ के लिए force-directed लेआउट एल्गोरिद्म। 1 मिलियन से अधिक नोड तक स्केल कर सकता है, इसलिए बड़े ग्राफ़ के लिए आदर्श है। लेकिन छोटे ग्राफ़ (सैकड़ों या कम) हमेशा इतने अच्छे नहीं दिखते। यह एल्गोरिद्म अदिशात्मक भारित ग्राफ़ की अपेक्षा करता है और क्लस्टर को बेहतर अलग करने का लक्ष्य रखता है।

OpenOrd.properties.edgecut.name = एज कट
OpenOrd.properties.edgecut.description = 0 का अर्थ कोई कटिंग नहीं और 1 अधिकतम कटिंग। अधिक कटिंग से परिणाम अधिक क्लस्टर्ड होता है।

OpenOrd.properties.numthreads.name = थ्रेड की संख्या
OpenOrd.properties.numthreads.description = एल्गोरिद्म चलाने के लिए उपयोग होने वाले थ्रेड की संख्या। मल्टी-कोर कंप्यूटर के लिए यह संख्या बढ़ाएँ। एक थ्रेड डिस्प्ले के लिए रखने हेतु कोर माइनस 1 रखना अनुशंसित है।

OpenOrd.properties.numiterations.name = पुनरावृत्तियों की संख्या
OpenOrd.properties.numiterations.description = यह संख्या केवल बहुत बड़े ग्राफ़ के लिए बढ़ाएँ। जितनी अधिक पुनरावृत्तियाँ, उतना अधिक समय और परिणाम उतना कम घना होगा। न्यूनतम 100 और डिफ़ॉल्ट 750 है।

OpenOrd.properties.seed.name = यादृच्छिक बीज
OpenOrd.properties.seed.description = एल्गोरिद्म का परिणाम बीज, पुनरावृत्तियों की संख्या और थ्रेड की संख्या पर निर्भर करता है।

OpenOrd.properties.realtime.name = निश्चित समय
OpenOrd.properties.realtime.description = जब कुछ नोड स्थिर हों (राइट-क्लिक आयत चयन > स्थिर करें), यह नियंत्रित करता है कि स्थिर नोड कितनी देर न हिलें। 0 का अर्थ वे स्थिर नहीं होंगे और 1 का अर्थ वे स्थिर रहेंगे।

OpenOrd.properties.stage.liquid.name = तरल (%)
OpenOrd.properties.stage.liquid.description = तरल चरण में बिताया गया समय प्रतिशत

OpenOrd.properties.stage.expansion.name = विस्तार (%)
OpenOrd.properties.stage.expansion.description = विस्तार चरण में बिताया गया समय प्रतिशत

OpenOrd.properties.stage.cooldown.name = शीतलन (%)
OpenOrd.properties.stage.cooldown.description = शीतलन चरण में बिताया गया समय प्रतिशत

OpenOrd.properties.stage.crunch.name = क्रंच (%)
OpenOrd.properties.stage.crunch.description = क्रंच चरण में बिताया गया समय प्रतिशत

OpenOrd.properties.stage.simmer.name = सिमर (%)
OpenOrd.properties.stage.simmer.description = सिमर चरण में बिताया गया समय प्रतिशत

OpenOrd.properties.layoutsize.name = लेआउट आकार
OpenOrd.properties.layoutsize.description = आउटपुट समन्वय स्थान का कुल विस्तार। सबसे दूर का नोड इस मान के आधे के ± पर रखा जाएगा। डिफ़ॉल्ट 20000 है, जिससे समन्वय सीमा ±10000 होती है।
