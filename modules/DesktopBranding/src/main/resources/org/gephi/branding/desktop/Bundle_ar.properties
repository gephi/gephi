OutOfMemoryError.canIncreaseMemory.message=Gephi reached the maximum amount of memory ({0}). \u0648\u0647\u0630\u0627 \u064A\u062D\u062F\u062B \u0639\u0646\u062F\u0645\u0627 \u064A\u0643\u0648\u0646 \u062D\u062C\u0645 \u0627\u0644\u0628\u064A\u0627\u0646\u0627\u062A \u0643\u0628\u064A\u0631\u0627 \u062C\u062F\u0627. \u064A\u0645\u0643\u0646 \u0632\u064A\u0627\u062F\u0629 \u0627\u0644\u062D\u062F \u062D\u062A\u0649 {1} \u0639\u0644\u0649 \u0627\u0644\u0643\u0645\u0628\u064A\u0648\u062A\u0631 \u0627\u0644\u062E\u0627\u0635 \u0628\u0643.\n\n\u062C\u064A\u0641\u064A \u0633\u064A\u062D\u0627\u0648\u0644 \u0627\u0646\u0642\u0627\u0630 \u0645\u0634\u0631\u0648\u0639\u0643 \u0642\u0628\u0644 \u0627\u0644\u062E\u0631\u0648\u062C \u0625\u0630\u0627 \u0623\u0644\u063A\u064A\u062A\u060C \u0641\u0645\u0646 \u0627\u0644\u0645\u0631\u062C\u062D \u0623\u0646 \u062C\u064A\u0641\u064A \u0633\u0648\u0641 \u062A\u062A\u0648\u0642\u0641 \u0639\u0646 \u0627\u0644\u0627\u0633\u062A\u062C\u0627\u0628\u0629.
